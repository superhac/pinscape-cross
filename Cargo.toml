[workspace]
resolver = "2"
members = [
    "crates/pinscape-protocol",
    "crates/pinscape-usb",
    "crates/pinscape-config",
    "crates/pinscape-cli",
    "src-tauri",
]
# The Tauri app needs WebKitGTK dev libraries on Linux; build the
# non-GUI crates alone with: cargo build -p pinscape-cli
default-members = [
    "crates/pinscape-protocol",
    "crates/pinscape-usb",
    "crates/pinscape-config",
    "crates/pinscape-cli",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "BSD-3-Clause"
rust-version = "1.80"

[workspace.dependencies]
pinscape-protocol = { path = "crates/pinscape-protocol" }
pinscape-usb = { path = "crates/pinscape-usb" }
pinscape-config = { path = "crates/pinscape-config" }
nusb = "0.2.9"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
